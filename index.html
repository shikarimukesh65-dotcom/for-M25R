<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0c0814;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // ==========================================
    // ✏️ EDIT YOUR SETTINGS & PHRASES HERE
    // ==========================================
    const PHRASES = [
      "I love you", "Seni seviyorum", "Te amo", "Je t'aime", "Ich liebe dich",
      "Ti amo", "Eu te amo", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
      "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
      "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю", "Я тебя люблю"
    ];

    const SC = 21;          // Scale/size of the heart
    const ANIM = 42;        // Animation fade duration
    const SIZES = [12, 14, 16, 18]; // Font sizes for text inside

    // Heart parametric equations
    function heartX(t) {
      return 16 * Math.pow(Math.sin(t), 3);
    }
    function heartY(t) {
      return 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    }

    // Precalculate heart outline
    const POLY = [];
    const totalPoints = 600;
    for (let i = 0; i < totalPoints; i++) {
      const t = (Math.PI * 2 * i) / totalPoints;
      POLY.push({ x: heartX(t), y: heartY(t) });
    }

    const ys = POLY.map(p => p.y);
    const YMAX = Math.max(...ys);
    const YMIN = Math.min(...ys);
    const CY = (YMAX + YMIN) / 2;

    const particles = [];
    let phraseIndex = 0;

    function addParticle() {
      const phrase = PHRASES[phraseIndex];
      phraseIndex = (phraseIndex + 1) % PHRASES.length;

      const t = Math.random() * 2 * Math.PI;
      const rad = Math.random() * 0.85;

      const x = heartX(t) * SC * rad;
      const y = (heartY(t) - CY) * SC * rad;

      particles.push({
        x: x,
        y: y,
        text: phrase,
        size: SIZES[Math.floor(Math.random() * SIZES.length)],
        life: 0,
        maxLife: ANIM
      });
    }

    let frame = 0;

    function animate() {
      // Background clear
      ctx.fillStyle = "#0c0814";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Draw Glowing Heart Outline
      ctx.beginPath();
      ctx.strokeStyle = "#e60d24";
      ctx.lineWidth = 2.5;
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#e60d24";

      for (let i = 0; i < POLY.length; i++) {
        const px = cx + POLY[i].x * SC;
        const py = cy - (POLY[i].y - CY) * SC;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();

      // Add words dynamically
      if (frame % 3 === 0 && particles.length < 100) {
        addParticle();
      }

      // Render words inside heart
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life++;

        const alpha = Math.sin((p.life / p.maxLife) * Math.PI);

        ctx.font = `bold ${p.size}px Arial`;
        ctx.fillStyle = `rgba(255, 105, 135, ${alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ff0055";
        ctx.textAlign = "center";

        ctx.fillText(p.text, cx + p.x, cy - p.y);

        if (p.life >= p.maxLife) {
          particles.splice(i, 1);
        }
      }

      frame++;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
